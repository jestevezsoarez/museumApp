
<div class="row animated fadeIn fast">
    <div class="col-lg-12">
        <div class="input-group">
          <input type="text" class="form-control" #termino placeholder="Search Terms..." (keydown.enter)="search(termino.value)">
          <span class="input-group-btn">
            <button class="btn btn-primary" type="button" (click)="search(termino.value)">Search</button>
          </span>
        </div>
      </div>
</div>

<div class="alert alert-primary mt-5" role="alert" *ngIf="searchEmpty">
    There are no results for the search terms: {{ termino.value }} !
</div>

<!-- Corregimos la grilla envolviendo las columnas en un contenedor adecuado -->
<div class="container-fluid mt-4">
    <div class="card-columns">
        <div class="card" *ngFor="let item of works">        
          
          <!-- Eliminamos el pipe viejo y apuntamos directo al nodo limpio.webImage.url -->
          <img *ngIf="item.webImage" [src]="item.webImage.url" class="card-img-top" [alt]="item.title">
          
          <div class="card-body">
              <h5 class="card-title">{{ item.title }}</h5>
              <p class="card-text">{{ item.longTitle }}.</p>
              <span class="badge badge-pill badge-primary">
                  {{ item.principalOrFirstMaker }}
              </span>
          </div>
        </div>
    </div>
</div>
